spring.application.name=jobportal

# Load variables from .env (if present) so terminal runs work, not just VS Code
spring.config.import=optional:file:.env[.properties]

# Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA: schema is owned by Flyway; Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Hide stack traces in error responses (devtools enables them by default)
spring.web.error.include-stacktrace=never

# JWT
jwt.secret=${JWT_SECRET}
jwt.issuer=jobportal
jwt.expiration=1h

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.operations-sorter=method

# Initial admin account (created at startup if missing)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
